run:
  go: "1.26"

linters:
  enable:
    - errcheck      # no silently discarded errors (AGENTS.md §5.2)
    - govet         # go vet checks
    - staticcheck   # static analysis
    - goimports     # import ordering (AGENTS.md §5.1)
    - gofmt         # formatting (AGENTS.md §5.1)
    - revive        # Effective Go style (replaces golint)
    - unused        # catches unused exports
    - contextcheck  # context not stored in structs (AGENTS.md §5.6)
    - noctx         # http requests must carry context

linters-settings:
  errcheck:
    check-type-assertions: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck  # test helpers often ignore errors intentionally
