openapi: 3.0.3
info:
  title: Temporal AI API
  version: 1.0.0
  description: >
    Automated prediction market trading system.
    All REST routes use the /api/v1/ prefix. The WebSocket feed is at /ws/feed.

security:
  - BearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /api/v1/auth/login:
    post:
      summary: Authenticate and obtain tokens
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >
            Login successful. Access token returned in body.
            Refresh token set in httpOnly Secure SameSite=Strict cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using httpOnly refresh token cookie
      operationId: refreshToken
      tags: [auth]
      security: []
      responses:
        "200":
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token and clear cookie
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out successfully.
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── Markets ───────────────────────────────────────────────────────────────

  /api/v1/markets:
    get:
      summary: List markets available on Kalshi
      operationId: listMarkets
      tags: [markets]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional search query string.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/markets/{id}:
    get:
      summary: Get a single market by its Kalshi ID
      operationId: getMarket
      tags: [markets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "404":
          $ref: "#/components/responses/ErrorNotFound"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── Subscriptions ─────────────────────────────────────────────────────────

  /api/v1/subscriptions:
    get:
      summary: List the caller's market subscriptions
      operationId: listSubscriptions
      tags: [subscriptions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSubscription"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

    post:
      summary: Subscribe to a market
      operationId: createSubscription
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSubscription"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "409":
          $ref: "#/components/responses/ErrorConflict"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/subscriptions/{market_id}:
    delete:
      summary: Unsubscribe from a market
      operationId: deleteSubscription
      tags: [subscriptions]
      parameters:
        - name: market_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unsubscribed successfully.
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "404":
          $ref: "#/components/responses/ErrorNotFound"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── Confidence ────────────────────────────────────────────────────────────

  /api/v1/confidence:
    get:
      summary: List confidence scores for all subscribed markets
      operationId: listConfidence
      tags: [confidence]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketConfidence"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/confidence/{market_id}:
    get:
      summary: Get confidence score for a specific subscribed market
      operationId: getConfidence
      tags: [confidence]
      parameters:
        - name: market_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketConfidence"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "404":
          $ref: "#/components/responses/ErrorNotFound"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── Orders ────────────────────────────────────────────────────────────────

  /api/v1/orders:
    get:
      summary: List orders for the authenticated user
      operationId: listOrders
      tags: [orders]
      parameters:
        - name: marketId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, submitted, filled, cancelled, failed]
        - name: simulated
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/orders/{id}:
    get:
      summary: Get a single order by ID
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "404":
          $ref: "#/components/responses/ErrorNotFound"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── Positions ─────────────────────────────────────────────────────────────

  /api/v1/positions:
    get:
      summary: List open positions for the authenticated user
      operationId: listPositions
      tags: [positions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── User config ───────────────────────────────────────────────────────────

  /api/v1/config:
    get:
      summary: Get the authenticated user's trading configuration
      operationId: getConfig
      tags: [config]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConfig"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

    put:
      summary: Replace the authenticated user's trading configuration
      operationId: updateConfig
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserConfigRequest"
      responses:
        "200":
          description: Configuration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConfig"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── Admin ─────────────────────────────────────────────────────────────────

  /api/v1/admin/users:
    get:
      summary: List all users (admin only)
      operationId: adminListUsers
      tags: [admin]
      x-admin-required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

    post:
      summary: Create a new user (admin only)
      operationId: adminCreateUser
      tags: [admin]
      x-admin-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "409":
          $ref: "#/components/responses/ErrorConflict"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/admin/users/{id}:
    put:
      summary: Update a user's role or config (admin only)
      operationId: adminUpdateUser
      tags: [admin]
      x-admin-required: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "404":
          $ref: "#/components/responses/ErrorNotFound"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

    delete:
      summary: Delete a user (admin only)
      operationId: adminDeleteUser
      tags: [admin]
      x-admin-required: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted.
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "404":
          $ref: "#/components/responses/ErrorNotFound"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/admin/kill-switch:
    post:
      summary: Activate or deactivate the trading kill switch (admin only)
      operationId: adminSetKillSwitch
      tags: [admin]
      x-admin-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillSwitchRequest"
      responses:
        "200":
          description: Kill switch state updated. Returns updated system config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfig"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/admin/system-status:
    get:
      summary: Get system runtime status (admin only)
      operationId: adminGetSystemStatus
      tags: [admin]
      x-admin-required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  /api/v1/admin/reload-model:
    post:
      summary: Trigger a hot-reload of the ML sidecar model (admin only)
      operationId: adminReloadModel
      tags: [admin]
      x-admin-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReloadModelRequest"
      responses:
        "202":
          description: Reload accepted; sidecar will swap model asynchronously.
        "401":
          $ref: "#/components/responses/ErrorUnauthorized"
        "403":
          $ref: "#/components/responses/ErrorForbidden"
        "422":
          $ref: "#/components/responses/ErrorUnprocessable"
        "500":
          $ref: "#/components/responses/ErrorInternalServer"

  # ── WebSocket ─────────────────────────────────────────────────────────────

  /ws/feed:
    get:
      summary: Real-time WebSocket feed
      operationId: wsFeed
      tags: [websocket]
      description: >
        Upgrade to WebSocket. Requires a valid Bearer token in the Authorization
        header at upgrade time. All messages conform to the WsMessage discriminated
        union (discriminator property: type).
      responses:
        "101":
          description: Switching Protocols

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # ── Security ──────────────────────────────────────────────────────────────

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Reusable responses ────────────────────────────────────────────────────

  responses:
    ErrorUnauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ErrorForbidden:
      description: Authenticated but insufficient permissions (requires admin role).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ErrorNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ErrorConflict:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ErrorUnprocessable:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ErrorInternalServer:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ── Schemas ───────────────────────────────────────────────────────────────

  schemas:

    # ── Error envelope ──────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: string
          description: Human-readable error message.
        requestId:
          type: string
          format: uuid
          description: Correlates this error to server-side log entries.
        details:
          type: object
          additionalProperties: true
          description: Optional field-level validation errors or structured debug info.

    # ── Auth ────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required: [accessToken, userId, role]
      properties:
        accessToken:
          type: string
          description: RS256-signed JWT access token (15-minute TTL).
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, trader, viewer]

    # ── User ────────────────────────────────────────────────────────────────

    User:
      type: object
      required: [id, email, role, config, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, trader, viewer]
        config:
          $ref: "#/components/schemas/UserConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserConfig:
      type: object
      required:
        - autoTradingEnabled
        - maxRiskPerTrade
        - maxDailyLoss
        - maxOpenPositions
        - buyThreshold
        - sellThreshold
        - signalDecayHalfLifeSecs
      properties:
        autoTradingEnabled:
          type: boolean
        maxRiskPerTrade:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        maxDailyLoss:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        maxOpenPositions:
          type: integer
          minimum: 1
          maximum: 20
        buyThreshold:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        sellThreshold:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        signalDecayHalfLifeSecs:
          type: integer
          minimum: 1

    UpdateUserConfigRequest:
      type: object
      required:
        - autoTradingEnabled
        - maxRiskPerTrade
        - maxDailyLoss
        - maxOpenPositions
        - buyThreshold
        - sellThreshold
        - signalDecayHalfLifeSecs
      properties:
        autoTradingEnabled:
          type: boolean
        maxRiskPerTrade:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        maxDailyLoss:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        maxOpenPositions:
          type: integer
          minimum: 1
          maximum: 20
        buyThreshold:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        sellThreshold:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        signalDecayHalfLifeSecs:
          type: integer
          minimum: 1

    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, trader, viewer]

    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, trader, viewer]
        config:
          $ref: "#/components/schemas/UserConfig"

    # ── Market ──────────────────────────────────────────────────────────────

    Market:
      type: object
      required: [id, question, status, yesPrice, noPrice, lastUpdated]
      properties:
        id:
          type: string
          description: Kalshi market ticker/ID.
        question:
          type: string
        description:
          type: string
        category:
          type: string
        closeTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [open, closed, resolved]
        yesPrice:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        noPrice:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        volume:
          type: number
          format: float
          minimum: 0.0
        confidenceScore:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
          description: >
            System-computed confidence score for this market.
            Populated when the market has an active subscription.
        lastUpdated:
          type: string
          format: date-time

    # ── Subscription ─────────────────────────────────────────────────────────

    MarketSubscription:
      type: object
      required: [userId, marketId, keywordTags, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        marketId:
          type: string
        keywordTags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CreateSubscriptionRequest:
      type: object
      required: [marketId]
      properties:
        marketId:
          type: string
          minLength: 1
        keywordTags:
          type: array
          items:
            type: string
          default: []

    # ── Confidence ───────────────────────────────────────────────────────────

    MarketConfidence:
      type: object
      required: [marketId, score, signalCount, lastUpdated]
      properties:
        marketId:
          type: string
        score:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
          description: >
            Decayed weighted sum of all signals. Positive = net bullish.
            Negative = net bearish. Near zero = insufficient signal.
        signalCount:
          type: integer
          minimum: 0
        lastUpdated:
          type: string
          format: date-time

    # ── Order ────────────────────────────────────────────────────────────────

    Order:
      type: object
      required:
        - id
        - userId
        - marketId
        - side
        - size
        - limitPrice
        - status
        - simulated
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        marketId:
          type: string
        side:
          type: string
          enum: [yes, no]
        size:
          type: number
          format: float
        limitPrice:
          type: number
          format: float
        status:
          type: string
          enum: [pending, submitted, filled, cancelled, failed]
        simulated:
          type: boolean
        brokerOrderId:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        filledAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true

    # ── Position ─────────────────────────────────────────────────────────────

    Position:
      type: object
      required: [marketId, side, contracts, avgPrice, currentValue, pnl, openedAt]
      properties:
        marketId:
          type: string
        side:
          type: string
          enum: [yes, no]
        contracts:
          type: number
          format: float
        avgPrice:
          type: number
          format: float
        currentValue:
          type: number
          format: float
        pnl:
          type: number
          format: float
        openedAt:
          type: string
          format: date-time

    # ── System config / status ────────────────────────────────────────────────

    SystemConfig:
      type: object
      required:
        - autoTradingSystemEnabled
        - killSwitchActive
        - maxGlobalOpenPositions
        - modelVersion
        - updatedAt
      properties:
        autoTradingSystemEnabled:
          type: boolean
        killSwitchActive:
          type: boolean
        maxGlobalOpenPositions:
          type: integer
          minimum: 0
        modelVersion:
          type: string
        updatedAt:
          type: string
          format: date-time

    SystemStatus:
      type: object
      required:
        - goroutineCount
        - workerQueueDepth
        - modelVersion
        - killSwitchActive
        - uptime
      properties:
        goroutineCount:
          type: integer
          minimum: 0
        workerQueueDepth:
          type: integer
          minimum: 0
        modelVersion:
          type: string
        killSwitchActive:
          type: boolean
        uptime:
          type: string
          description: ISO 8601 duration string (e.g. PT1H30M).

    KillSwitchRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    ReloadModelRequest:
      type: object
      required: [modelPath]
      properties:
        modelPath:
          type: string
          minLength: 1

    # ── News event ───────────────────────────────────────────────────────────

    NewsEvent:
      type: object
      required: [id, source, title]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        title:
          type: string

    # ── WebSocket message discriminated union ─────────────────────────────────

    WsMessage:
      oneOf:
        - $ref: "#/components/schemas/WsConfidenceUpdate"
        - $ref: "#/components/schemas/WsStrategyOutput"
        - $ref: "#/components/schemas/WsOrderUpdate"
        - $ref: "#/components/schemas/WsSignalEvent"
        - $ref: "#/components/schemas/WsSystemAlert"
        - $ref: "#/components/schemas/WsNewsEvent"
      discriminator:
        propertyName: type
        mapping:
          confidence_update: "#/components/schemas/WsConfidenceUpdate"
          strategy_output: "#/components/schemas/WsStrategyOutput"
          order_update: "#/components/schemas/WsOrderUpdate"
          signal_event: "#/components/schemas/WsSignalEvent"
          system_alert: "#/components/schemas/WsSystemAlert"
          news_event: "#/components/schemas/WsNewsEvent"

    WsConfidenceUpdate:
      type: object
      required: [type, marketId, score, ts]
      properties:
        type:
          type: string
          enum: [confidence_update]
        marketId:
          type: string
        score:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
        ts:
          type: string
          format: date-time

    WsStrategyOutput:
      type: object
      required: [type, marketId, decision, confidence, ts]
      properties:
        type:
          type: string
          enum: [strategy_output]
        marketId:
          type: string
        decision:
          type: string
          enum: [BUY, SELL, NO_TRADE]
        confidence:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
        ts:
          type: string
          format: date-time

    WsOrderUpdate:
      type: object
      required: [type, orderId, status, ts]
      properties:
        type:
          type: string
          enum: [order_update]
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, submitted, filled, cancelled, failed]
        ts:
          type: string
          format: date-time

    WsSignalEvent:
      type: object
      required: [type, marketId, netSignal, source, ts]
      properties:
        type:
          type: string
          enum: [signal_event]
        marketId:
          type: string
        netSignal:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
        source:
          type: string
        ts:
          type: string
          format: date-time

    WsSystemAlert:
      type: object
      required: [type, level, message, ts]
      properties:
        type:
          type: string
          enum: [system_alert]
        level:
          type: string
          enum: [info, warn, error, critical]
        message:
          type: string
        ts:
          type: string
          format: date-time

    WsNewsEvent:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [news_event]
        payload:
          $ref: "#/components/schemas/NewsEvent"
