[project]
name = "temporal-ml-sidecar"
version = "2.0.0"
description = "FinBERT inference sidecar for Temporal AI"
requires-python = ">=3.14"

dependencies = [
    # FastAPI + ASGI server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Pydantic v2 (FastAPI dependency — pinned for model validation)
    "pydantic>=2.7.0",

    # ONNX runtime (CPU only; swap for onnxruntime-gpu if GPU is available)
    "onnxruntime>=1.18.0",

    # HuggingFace tokenizer for FinBERT
    # transformers is used ONLY for AutoTokenizer — no PyTorch dependency here.
    "transformers>=4.41.0",

    # Numerical backend for tokenizer output + ONNX inputs
    "numpy>=1.26.0",

    # TOML parsing (stdlib tomllib available in 3.11+; no extra dep needed)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",       # async test client for FastAPI
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PLW", "ANN"]
ignore = [
    "ANN101",  # missing type annotation for `self`
    "ANN102",  # missing type annotation for `cls`
]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
